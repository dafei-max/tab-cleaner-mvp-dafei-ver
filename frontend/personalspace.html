<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Cleaner - Personal Space</title>
  <style>
    @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
    * {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0px;
      height: 100%;
      overflow: hidden;
    }
    button:focus-visible {
      outline: 2px solid #4a90e2 !important;
      outline: -webkit-focus-ring-color auto 5px !important;
    }
    a {
      text-decoration: none;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- PersonalSpace 颜色分析器（Eagle 式颜色搜索） -->
  <!-- 注意：这是一个传统 IIFE 脚本，不是 ES 模块，Vite 会直接复制它 -->
  <script src="./assets/ps_color_analyzer.js" data-no-bundle></script>
  <!-- Eagle 式图片存储（永久保存到 IndexedDB） -->
  <script src="./assets/eagle_storage.js" data-no-bundle></script>
  <script type="module" src="./src/personalspace/index.jsx"></script>
</body>
</html>
